<!DOCTYPE html>
<html>
<head>
    <title>Longest Palindromic Substring</title>
</head>
<body>
    <h2>Find Longest Palindromic Substring</h2>
    <input type="text" id="inputString" placeholder="Enter a string" />
    <button onclick="showLongestPalindrome()">Find</button>

    <div id="result"></div>

    <script>
        function findLongestPalindrome(str) {
            if (!str || str.length < 1) return "";

            let start = 0;
            let end = 0;

            function expandAroundCenter(s, left, right) {
                while (left >= 0 && right < s.length && s[left] === s[right]) {
                    left--;
                    right++;
                }
                return right - left - 1;
            }

            for (let i = 0; i < str.length; i++) {
                const len1 = expandAroundCenter(str, i, i);
                const len2 = expandAroundCenter(str, i, i + 1);
                const len = Math.max(len1, len2);

                if (len > end - start) {
                    start = i - Math.floor((len - 1) / 2);
                    end = i + Math.floor(len / 2);
                }
            }

            return str.substring(start, end + 1);
        }

        function showLongestPalindrome() {
            const input = document.getElementById('inputString').value;
            const result = findLongestPalindrome(input);
            document.getElementById('result').textContent = 
                result ? `Longest palindrome: "${result}"` : "No palindrome found.";
        }
    </script>
</body>
</html>
