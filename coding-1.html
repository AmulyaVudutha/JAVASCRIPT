<!DOCTYPE html>
<html>
    <head>
        <title>The Encapsulated Counter Factory</title> 
    </head>
    <body>
        <script>
            function createUniqueCounter(){
                let count=0;
                function increment(){
                    count++;
                    return count;
                }
                function getValue() {
                    return count;
                }
                return {
                    increment: increment,
                    getValue: getValue
                };
            }
            const c1=createUniqueCounter();
            const c2=createUniqueCounter();
            console.log(c1.increment());
            console.log(c1.getValue());
            console.log(c2.getValue());
            console.log(c2.increment());
            console.log(c2.getValue());
        </script>
    </body>
</html>
